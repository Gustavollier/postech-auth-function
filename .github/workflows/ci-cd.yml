name: CI/CD - Auth Function

# Build e deploy rodam nos runners do GitHub. A autenticação no Azure usa OIDC
# (federated credentials) — nenhuma senha ou certificado fica guardado.
#
# Secrets (já configurados no repositório):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  ACR_NAME: postechacr13soat
  IMAGE_NAME: postech-auth-function
  RESOURCE_GROUP: pos-tech-fiap
  CONTAINER_APP: postech-auth-fn-13soat
  TEST_PATH: tests/PosTech.AuthFunction.Tests/PosTech.AuthFunction.Tests.csproj

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Inclui o teste que valida o JWT emitido contra os TokenValidationParameters
      # exatos da API principal. Se ele quebrar, a API rejeitaria o token.
      - name: Testes
        run: dotnet test ${{ env.TEST_PATH }} -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

  deploy:
    name: Imagem & Deploy
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login no ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build e push da imagem
        run: |
          set -euo pipefail
          REGISTRY="${{ env.ACR_NAME }}.azurecr.io"
          TAG="${{ github.sha }}"

          docker build \
            -t "$REGISTRY/${{ env.IMAGE_NAME }}:$TAG" \
            -t "$REGISTRY/${{ env.IMAGE_NAME }}:latest" \
            -f Dockerfile .

          docker push "$REGISTRY/${{ env.IMAGE_NAME }}:$TAG"
          docker push "$REGISTRY/${{ env.IMAGE_NAME }}:latest"

          echo "IMAGE=$REGISTRY/${{ env.IMAGE_NAME }}:$TAG" >> "$GITHUB_ENV"

      # Na primeira execução o Container App ainda não existe — quem o cria é o
      # Terraform do repo postech-infra-k8s, que precisa da imagem já publicada.
      # Daí em diante, cada deploy apenas troca a tag da imagem.
      - name: Atualizar o Container App
        run: |
          set -euo pipefail
          if az containerapp show --name "${{ env.CONTAINER_APP }}" \
                                  --resource-group "${{ env.RESOURCE_GROUP }}" &>/dev/null; then
            az containerapp update \
              --name "${{ env.CONTAINER_APP }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "$IMAGE"
            echo "Container App atualizado para $IMAGE"
          else
            echo "Container App ainda não existe."
            echo "Imagem publicada. Rode a pipeline do repositorio postech-infra-k8s para cria-lo."
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show --name "${{ env.CONTAINER_APP }}" \
                   --resource-group "${{ env.RESOURCE_GROUP }}" \
                   --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")

          if [ -z "$FQDN" ]; then
            echo "Container App ainda não provisionado — smoke test pulado."
            exit 0
          fi

          for tentativa in $(seq 1 12); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/api/health" || true)
            echo "Tentativa $tentativa: HTTP $codigo"
            [ "$codigo" = "200" ] && { echo "Health check OK"; exit 0; }
            sleep 10
          done

          echo "::error::Health check falhou"
          exit 1
